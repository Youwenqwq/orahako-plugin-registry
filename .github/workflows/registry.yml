name: Registry

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: registry-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout metadata
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated plugin index is committed
        run: |
          pnpm run generate
          git diff --exit-code -- dist/plugins.json

      - name: Validate committed artifacts
        run: pnpm run validate

      - name: Upload plugin index
        uses: actions/upload-artifact@v7
        with:
          name: plugins.json
          path: dist/plugins.json
          if-no-files-found: error
          retention-days: 14
