name: Registry

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: registry-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout metadata
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated plugin index is committed
        run: |
          pnpm run generate
          git diff --exit-code -- dist/plugins.json

      - name: Validate committed artifacts
        run: pnpm run validate

      - name: Verify published releases remain immutable
        if: github.event_name == 'pull_request'
        run: pnpm run check:immutable "origin/${{ github.base_ref }}"

      - name: Upload plugin index
        uses: actions/upload-artifact@v7
        with:
          name: plugins.json
          path: dist/plugins.json
          if-no-files-found: error
          retention-days: 14

  purge-cdn:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr cache for plugin index
        run: |
          curl -fsSL "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/dist/plugins.json" \
            || echo "::warning::jsDelivr cache purge failed; CDN will refresh on its normal TTL"
